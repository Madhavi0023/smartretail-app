name: SmartRetail CI

on:
  push:
    branches:
      - develop
      - feature/backend-init
      - main

  pull_request:
    branches:
      - develop
      - main
jobs:
  oidc-debug:
    name: Debug OIDC Claims
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get OIDC claims
        uses: github/actions-oidc-debugger@main

  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
        run: |
          python -m pytest -v

  docker-build:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t smartretail-backend:${{ github.sha }} \
            ./backend

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartretail-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::047619944584:role/SmartRetailGitHubActionsECRRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag \
            smartretail-backend:${{ github.sha }} \
            047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}
