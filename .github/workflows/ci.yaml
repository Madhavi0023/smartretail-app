name: SmartRetail CI

on:
  push:
    branches:
      - develop
      - feature/backend-init
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
        run: |
          python -m pytest -v

  # ============================================================
  # BUILD + SECURITY SCAN + ECR PUSH
  # ============================================================

  docker-build:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t smartretail-backend:${{ github.sha }} \
            ./backend

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartretail-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::047619944584:role/SmartRetailGitHubActionsECRRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag \
            smartretail-backend:${{ github.sha }} \
            047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}

  # ============================================================
  # DEPLOY TO EKS
  # ============================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker-build

    # Only deploy after push to main/develop.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::047619944584:role/SmartRetailGitHubActionsECRRole
          aws-region: ap-south-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name smartretail-app-eks

      - name: Update Kubernetes deployment image
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}|g" \
            k8s/deployment.yaml

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Check deployment
        run: |
          kubectl rollout status \
            deployment/smartretail-backend \
            -n smartretail \
            --timeout=180s

      - name: Check pods
        run: |
          kubectl get pods -n smartretail

      - name: Check service
        run: |
          kubectl get svc -n smartretail

      - name: Check ingress
        run: |
          kubectl get ingress -n smartretail
