name: SmartRetail CI

on:
  push:
    branches:
      - develop
      - feature/backend-init
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: write

jobs:

  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
        run: |
          python -m pytest -v


  # ============================================================
  # BUILD + SECURITY SCAN + ECR PUSH
  # ============================================================

  docker-build:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t smartretail-backend:${{ github.sha }} \
            ./backend

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smartretail-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::047619944584:role/SmartRetailGitHubActionsECRRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag \
            smartretail-backend:${{ github.sha }} \
            047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            047619944584.dkr.ecr.ap-south-1.amazonaws.com/smartretail-backend:${{ github.sha }}
              # ============================================================
  # UPDATE HELM IMAGE TAG
  # ============================================================

  update-helm:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in Helm values
        run: |
          sed -i 's|tag: ".*"|tag: "${{ github.sha }}"|' helm/smartretail/values.yaml

      - name: Commit and push Helm change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/smartretail/values.yaml

          git diff --cached --quiet || \
          git commit -m "Update SmartRetail image to ${{ github.sha }}"

          git push